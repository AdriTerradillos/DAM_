<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pagina_registro_Tuenti</title>
  <link rel="stylesheet" href="formulario01.css">
</head>

<body>

  <div class="formulario_registro">

  <div class = "cabecera"></div>
    <h1 class= "logo">Tuenti</h1>
  </div>

  <div class= "formulario">

    <h2 class = "ttulo"> Únete a Tuenti</h2>
    <p class = "parrafo-obligatorio" > Todos los campos son obligatorios</p>

    <form>
    <label>Nombre</label>
    <div class="fila">
      <input type="text" placeholder="Nombre">
      <input type="text" placeholder="Apellidos">
    </div>

    <label>Email:</label> <input type="email" placeholder="Correo electrónico">

    <label>Sexo</label>
    <div class="fila">
      <input type="radio" name="sexo"> Hombre
      <input type="radio" name="sexo"> Mujer
    </div>

    <label>Fecha de nacimiento</label>
    <div class="fila">
      <select>
        <option>Día</option>
      </select>
      <select>
        <option>Mes</option>
      </select>
      <select>
        <option>Año</option>
      </select>
    </div>

    <p class="texto-ayuda">La edad mínima permitida es 14</p>

    <label>Contraseña</label>
    <input type="password">

    <label>Número de móvil</label>
    <div class="fila">
      <select>
        <option>+34</option>
      </select>
      <input type="text">
    </div>

    <div class="condiciones">
      <input type="checkbox">
      <span>Acepto las condiciones de uso</span>
    </div>

    <button class="boton">¡Disfruta de Tuenti!</button>

    </form>

    </div>

    </div>




  </div>


</body>
</html>
